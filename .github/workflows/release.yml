name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit --colors=always

  release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Inject version into module
        run: |
          sed -i "s/public const VERSION = 'dev';/public const VERSION = '${{ steps.version.outputs.version }}';/" \
            modules/registrars/domainresellerapi/lib/ApiClient.php
          # Fail the release if the placeholder was not replaced
          grep -q "public const VERSION = '${{ steps.version.outputs.version }}';" \
            modules/registrars/domainresellerapi/lib/ApiClient.php

      - name: Package module
        run: |
          # The ZIP contains the folder domainresellerapi/ and is extracted into <whmcs>/modules/registrars/
          cp LICENSE modules/registrars/domainresellerapi/LICENSE
          cd modules/registrars
          zip -r "$GITHUB_WORKSPACE/domainresellerapi-${{ steps.version.outputs.version }}.zip" domainresellerapi
          unzip -l "$GITHUB_WORKSPACE/domainresellerapi-${{ steps.version.outputs.version }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: domainresellerapi-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
