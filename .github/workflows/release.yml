name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit --colors=always

  release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Inject version into module
        run: |
          sed -i "s/'APIVersion' => '1.1'/'APIVersion' => '1.1',\n        'Version' => '${{ steps.version.outputs.version }}'/" \
            modules/registrars/domainresellerapi/domainresellerapi.php

      - name: Package module
        run: |
          mkdir -p dist
          cp -r modules dist/
          cd dist
          zip -r ../domainresellerapi-${{ steps.version.outputs.version }}.zip modules/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: domainresellerapi-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
